[package]
name = "yuki-vtt-server"
description = "Hosts a Yuki Char Maker game table on the DM's own computer."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yuki-vtt-rules = { path = "../rules" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "limit", "compression-br", "compression-gzip"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imagesize = "0.13"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
opener = { version = "0.8", features = ["reveal"] }
tar = "0.4"
webp = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.27"
tempfile = "3"
