name: Installers

# Builds the window app's installers for Windows, macOS and Linux. Run it by hand from the
# Actions tab, or push a tag like v0.1.0. The installers are attached to the run.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: What the window app needs to build on Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri's build tool
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build the installers
        working-directory: apps/desktop
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: yuki-vtt-server-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
