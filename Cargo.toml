[workspace]
resolver = "3"
members = ["crates/rules", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/yuki/yuki-vtt-server"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
