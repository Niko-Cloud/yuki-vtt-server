[workspace]
resolver = "3"
members = ["crates/rules", "crates/server", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Niko-Cloud/yuki-vtt-server"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Release builds are made small without giving up speed: one pass over the whole program,
# and no debug symbols in the file.
[profile.release]
lto = true
codegen-units = 1
strip = true

# The libraries (pictures, compression, crypto) built optimised even for development: a map's
# tiles take a second instead of fifteen, so testing on the dev table feels like a real host.
[profile.dev.package."*"]
opt-level = 2
